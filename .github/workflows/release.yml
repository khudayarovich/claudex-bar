name: Release

# Publishes a GitHub Release for the version in ./VERSION the first time that version
# reaches main (bump VERSION to ship a new release). Can also be started by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v${{ steps.version.outputs.version }} already exists; nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      - name: Build universal app (Apple Silicon + Intel)
        run: make release-mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  windows:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test windows/tests/ClaudexBar.Core.Tests/ClaudexBar.Core.Tests.csproj -c Release
      - name: Publish x64 and ARM64
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish windows/src/ClaudexBar.App/ClaudexBar.App.csproj -c Release -r $rid -o "build/$rid"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $arch = $rid.Split('-')[1]
            Compress-Archive -Path "build/$rid/ClaudexBar.exe" -DestinationPath "dist/ClaudexBar-$version-windows-$arch.zip" -Force
          }
          Get-ChildItem dist
      - name: Smoke test (the app starts and renders every island state)
        continue-on-error: true
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'snapshots'
          $p = Start-Process -FilePath build/win-x64/ClaudexBar.exe -ArgumentList '--snapshot', $out -PassThru -Wait
          Get-ChildItem $out -ErrorAction SilentlyContinue
          if ((Get-ChildItem $out -Filter *.png -ErrorAction SilentlyContinue).Count -lt 7) { throw "Rendering failed (exit code $($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-snapshots
          path: snapshots/*.png
          if-no-files-found: ignore

  publish:
    needs: [plan, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          ls -la dist
          # A tag left behind by a deleted release would pin this release to that old commit.
          if tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq .object.sha 2>/dev/null) \
             && [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "Replacing leftover tag v$VERSION (was $tag_sha)"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v$VERSION"
          fi
          gh release create "v$VERSION" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ClaudexBar $VERSION" --notes-file .github/release-notes.md
